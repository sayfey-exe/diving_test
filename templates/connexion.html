{% extends "base.html" %}
{% block title %}Connexion — Plongée N2{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Connexion</h1>
  <p class="auth-sub">Retrouve ton espace personnel et tes statistiques.</p>
  <form method="post" class="auth-form">
    <label>E-mail
      <input type="email" name="email" value="{{ email or '' }}" required autocomplete="email">
    </label>
    <label>Mot de passe
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary btn-lg">Se connecter</button>
  </form>
  <p class="auth-forgot"><a href="{{ url_for('mot_de_passe_oublie') }}">Mot de passe oublié ?</a></p>
  <p class="auth-switch">Pas encore de compte ? <a href="{{ url_for('inscription') }}">Créer un compte</a></p>
</div>
{% endblock %}
