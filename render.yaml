# Configuration de déploiement pour Render (https://render.com).
# Render lit ce fichier automatiquement (« Blueprint ») pour créer le service
# web ET une base PostgreSQL gratuite (pour les comptes et statistiques).
databases:
  - name: plongee-db
    plan: free

services:
  - type: web
    name: plongee-n2-revision
    runtime: python
    plan: free
    branch: claude/diving-revision-app-ogizop
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render génère une clé de session aléatoire
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL          # connexion Postgres injectée automatiquement
        fromDatabase:
          name: plongee-db
          property: connectionString
      # --- À renseigner dans l'onglet « Environment » du service (valeurs secrètes) ---
      - key: ADMIN_EMAILS          # e-mails admin, séparés par des virgules
        sync: false
      # E-mails (confirmation d'adresse + mot de passe oublié). Voir README.
      - key: MAIL_SERVER           # ex. smtp.gmail.com
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME         # ex. ton.email@gmail.com
        sync: false
      - key: MAIL_PASSWORD         # mot de passe d'application (Gmail)
        sync: false
      - key: MAIL_SENDER           # optionnel : expéditeur affiché
        sync: false
      # Connexion Google / Facebook (optionnelle). Voir README.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      # Reconnaissance automatique d'espèces (optionnelle).
      - key: ANTHROPIC_API_KEY
        sync: false
